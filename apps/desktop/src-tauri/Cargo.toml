[package]
name = "waifu-desktop"
version = "0.1.0"
description = "Desktop shell for the AI Waifu soul container"
edition = "2021"

[lib]
name = "waifu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
enigo = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tiny_http = { version = "0.12.0", default-features = false }
xcap = { version = "0.9.10", default-features = false }

[profile.release]
strip = true
lto = true
opt-level = "s"
