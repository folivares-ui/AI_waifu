[package]
name = "waifu-desktop"
version = "0.1.0"
description = "Desktop shell for the AI Waifu soul container"
edition = "2021"

[lib]
name = "waifu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
