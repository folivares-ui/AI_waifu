<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Waifu</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #12101c; color: #eee; font-family: system-ui, sans-serif; text-align: center; }
      .spin { width: 36px; height: 36px; margin: 0 auto 16px; border: 4px solid #3a3560; border-top-color: #7a5cff; border-radius: 50%; animation: s 1s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      #msg { max-width: 320px; opacity: .85; }
      .err { color: #ff8a80; }
    </style>
  </head>
  <body>
    <div><div class="spin"></div><div id="msg">Despertando a tu companera...</div></div>
  </body>
</html>
